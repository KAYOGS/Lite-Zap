[package]
name = "lite-zap"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lite_zap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"     # Otimiza agressivamente para reduzir o tamanho do binário
lto = true          # Link-Time Optimization (remove funções que não estão sendo usadas)
codegen-units = 1   # Reduz paralelismo na compilação para aplicar mais otimizações globais
panic = "abort"     # Remove a pilha de erro de panic, economizando espaço em disco
strip = true        # Remove todos os símbolos de debug de dentro do executável final
